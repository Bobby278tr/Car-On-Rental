<template>
    <template lwc:if={carId}>
        <template lwc:if={hasData}>
            <lightning-card title={productName} class="slds-wrap">
                <div class="slds-var-p-around_small">
                    <c-car-image-manager record-id={carId} hide-upload-section=true></c-car-image-manager> 
                </div>

                <div class="slds-p-bottom_medium slds-text-align_center">
                    <lightning-button
                        label="Book Now"
                        variant="brand"
                        onclick={handleBookNow}
                    ></lightning-button>
                </div>

                <div class="slds-text-align_center slds-p-bottom_medium slds-text-body_regular">
                    <div class="slds-grid slds-gutters slds-grid_vertical-align-center">
                        <div class="slds-col slds-size_6-of-12">
                            <strong>Model : </strong>
                            <lightning-formatted-text value={modelField} class="slds-p-bottom_x-small"></lightning-formatted-text>
                        </div>
                        <div class="slds-col slds-size_6-of-12">
                            <strong>Car Family : </strong>
                            <lightning-formatted-text value={carFamilyField} class="slds-p-bottom_x-small"></lightning-formatted-text>
                        </div>
                    </div>

                    <div class="slds-p-top_medium slds-p-around_small">
                        <div class="slds-grid slds-gutters slds-grid_vertical-align-center slds-wrap">
                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small slds-text-title_bold">
                                <lightning-badge 
                                    label={seatingCapacityBadge}
                                    icon-name="utility:user"
                                ></lightning-badge>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                                <lightning-badge 
                                    label={transmissionBadge}
                                    icon-name="utility:settings"
                                ></lightning-badge>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                                <lightning-badge 
                                    label={fuelTypeBadge}
                                    icon-name="utility:energy"
                                ></lightning-badge>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                                <lightning-badge 
                                    label={rentalRateBadge}
                                    icon-name="utility:currency"
                                ></lightning-badge>
                            </div>
                        </div>
                    </div>

                    <div class="slds-p-bottom_medium section-divider">
                        <div class="slds-p-around_small">
                            <strong>Car Description : </strong>
                            <lightning-formatted-text
                                value={descriptionBdge}
                            ></lightning-formatted-text>
                        </div>
                    </div>
                </div>
                
            </lightning-card>

            <c-car-rating-review record-id={carId}></c-car-rating-review>
        </template>
        <template lwc:else>
            <lightning-card title="Car Details">
                <lightning-spinner alternative-text="Loading car details..." size="medium">
                </lightning-spinner>
                <p class="slds-m-top_medium slds-text-color_weak">
                    Loading car information...
                </p>
            </lightning-card>
        </template>
    </template>
    <template lwc:else>
        <lightning-card title="Car Details">
            <c-placeholder message="No Car is Selected"></c-placeholder>
        </lightning-card>
    </template>
</template>
